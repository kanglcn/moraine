# DS processing (tutorial: nbs/Tutorials/CLI/{Xinpu,CampiFlegrei}/03_ds.ipynb). Needs 01_load.toml.
#
#   moraine run examples/03_ds.toml --workdir WORK
#
# Statistically homogeneous pixels (SHP) -> DS candidates -> coherence matrix, EMI phase linking (coherence
# matrices that are not positive definite regularized, decision 0023) and weighted temporal coherence with
# the number of connected components of the coherent image pairs (fused, per raster chunk, decisions 0024 and
# 0028) -> DS selection: all images connected by coherent pairs and a high weighted temporal coherence.
# Outputs in WORK/ds/: ds_can_* (all candidates, hilbert order) and ds_hix, ds_ph, ds_gix, ds_e, ds_n
# (refined DS).

[vars]
shape = "2500,1834"               # (nlines, width) of raw/rslc.zarr
t_coh_w_min = "0.9"               # DS: minimum weighted temporal coherence (higher than the plain one, not comparable with it)

[defaults]
cuda = true                       # set to false without a GPU

# ---- SHP and DS candidates
[[step]]
name = "shp_test"                 # two sample KS test in an 11 x 11 window, SHPs = p value >= alpha
run = "shp-test"
rslc = "raw/rslc.zarr"
az_half_win = 5
r_half_win = 5
is_shp = "ds/ras_is_shp.zarr"
shp_num = "ds/ras_shp_num.zarr"
alpha = 0.05                      # significance level; add pvalue = "ds/ras_pvalue.zarr" to keep the p values

[[step]]
name = "shp_num_pyramid"
run = "ras-pyramid"
ras = "ds/ras_shp_num.zarr"
out_dir = "ds/ras_shp_num_pyramid"
method = "mean"

[[step]]
name = "ds_can"                   # DS candidates: at least 50 SHPs
run = "pc-logic-ras"
ras = "ds/ras_shp_num.zarr"
gix = "ds/ds_can_gix_ras_order.zarr"
operation = "ras>=50"
chunks = 200000

# ---- coherence, phase linking and temporal coherence per raster chunk
[[step]]
name = "ds_can_is_shp"            # SHPs of the candidates, one zarr per raster chunk
run = "ras2pc-ras-chunk"
gix = "ds/ds_can_gix_ras_order.zarr"
ras = "ds/ras_is_shp.zarr"
pc = "ds/chunks/ds_can_is_shp"
key = "ds/chunks/ds_can_key.zarr"
chunks = [1000, 1000]

[[step]]
name = "phase_linking"
run = "emperical-co-emi-temp-coh-pc"
rslc = "raw/rslc.zarr"
is_shp_dir = "ds/chunks/ds_can_is_shp"
gix = "ds/ds_can_gix_ras_order.zarr"
ph_dir = "ds/chunks/ds_can_ph"
t_coh_dir = "ds/chunks/ds_can_t_coh"
t_coh_w_dir = "ds/chunks/ds_can_t_coh_w"
n_components_dir = "ds/chunks/ds_can_n_components"
alpha = 1e-3                      # a point without any coherent image pair has all images connected with this probability
chunks = [1000, 1000]

# ---- hilbert order
[[step]]
name = "ds_can_hix"
run = "pc-hix"
gix = "ds/ds_can_gix_ras_order.zarr"
hix = "ds/ds_can_hix_unsorted.zarr"
shape = "${shape}"

[[step]]
name = "ds_can_sort"              # hilbert index and grid index in hilbert order + the sorting key
run = "pc-sort"
idx_in = "ds/ds_can_hix_unsorted.zarr"
idx = "ds/ds_can_hix.zarr"
pc_in = "ds/ds_can_gix_ras_order.zarr"
pc = "ds/ds_can_gix.zarr"
shape = "${shape}"
key = "ds/chunks/gix2hix_key.zarr"

[[step]]
name = "ds_can_concat"            # chunks -> one array each, in hilbert order
run = "pc-concat"
pcs = ["ds/chunks/ds_can_ph", "ds/chunks/ds_can_t_coh", "ds/chunks/ds_can_t_coh_w", "ds/chunks/ds_can_n_components"]
pc = ["ds/ds_can_ph.zarr", "ds/ds_can_t_coh.zarr", "ds/ds_can_t_coh_w.zarr", "ds/ds_can_n_components.zarr"]
key = ["ds/chunks/ds_can_key.zarr", "ds/chunks/gix2hix_key.zarr"]
chunks = 200000

[[step]]
name = "ds_can_t_coh_w_pyramid"
run = "pc-pyramid"
pc = "ds/ds_can_t_coh_w.zarr"
out_dir = "ds/ds_can_t_coh_w_pyramid"
method = "mean"
yx = "ds/ds_can_gix.zarr"
ras_resolution = 2

[[step]]
name = "ds_can_n_components_pyramid"
run = "pc-pyramid"
pc = "ds/ds_can_n_components.zarr"
out_dir = "ds/ds_can_n_components_pyramid"
method = "mean"
yx = "ds/ds_can_gix.zarr"
ras_resolution = 2

# ---- DS selection: all images connected by coherent image pairs and a high weighted temporal coherence
[[step]]
name = "ds_connected"             # one connected component
run = "pc-logic-pc"
idx_in = "ds/ds_can_hix.zarr"
pc_in = "ds/ds_can_n_components.zarr"
idx = "ds/ds_connected_hix.zarr"
operation = "pc_in==1"

[[step]]
name = "ds_connected_t_coh_w"     # the weighted temporal coherence of those points
run = "pc-select-data"
idx_in = "ds/ds_can_hix.zarr"
idx = "ds/ds_connected_hix.zarr"
pc_in = ["ds/ds_can_t_coh_w.zarr"]
pc = ["ds/ds_connected_t_coh_w.zarr"]

[[step]]
name = "ds"                       # high weighted temporal coherence
run = "pc-logic-pc"
idx_in = "ds/ds_connected_hix.zarr"
pc_in = "ds/ds_connected_t_coh_w.zarr"
idx = "ds/ds_hix.zarr"
operation = "(pc_in>=${t_coh_w_min})&(pc_in<=1.0)"

[[step]]
name = "ds_data"
run = "pc-select-data"
idx_in = "ds/ds_can_hix.zarr"
idx = "ds/ds_hix.zarr"
pc_in = ["ds/ds_can_ph.zarr", "ds/ds_can_gix.zarr"]
pc = ["ds/ds_ph.zarr", "ds/ds_gix.zarr"]

[[step]]
name = "ds_en"
run = "ras2pc"
idx = "ds/ds_hix.zarr"
ras = ["raw/e.zarr", "raw/n.zarr"]
pc = ["ds/ds_e.zarr", "ds/ds_n.zarr"]

[[step]]
name = "ds_ph_pyramid"            # phase history of the refined DS on the map
run = "pc-pyramid"
pc = "ds/ds_ph.zarr"
out_dir = "ds/ds_ph_pyramid"
method = "mean"
x = "ds/ds_e.zarr"
y = "ds/ds_n.zarr"
ras_resolution = 20
