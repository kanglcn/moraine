[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moraine"
dynamic = ["version"]
description = "Modern Radar Interferometry Environment, A simple, stupid InSAR postprocessing tool in big data era"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Kang Liang", email = "kanglcn@gmail.com" }]
keywords = ["InSAR", "PS", "DS", "CUDA", "Deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "colorcet",
    "zarr",
    "numcodecs",
    "toml",
    "numba>=0.59",
    "threadpoolctl",  # one BLAS thread inside the numba parallel loops (moraine.api.pl)
    "numexpr",
    "anywidget",  # interactive maps in VS Code and Jupyter notebooks (moraine.cli.view)
    "pyproj>=3.0",
    "psutil",  # available memory (moraine.api.utils_.get_mem_avail)
    "requests",
    "fpsample",
]

[project.optional-dependencies]
# deep learning models (n2f, n2fs3d, n2ft)
dl = ["torch"]
dev = ["pytest", "ruff"]
# the manual (mkdocs build --strict, decision 0032)
docs = ["mkdocs-material>=9.6", "mkdocstrings[python]>=0.27", "markdown-exec>=1.9",
        "mkdocs-static-i18n>=1.2", "jieba"]  # jieba: Chinese search index

[project.scripts]
moraine = "moraine.command:main"

[project.urls]
Homepage = "https://github.com/kanglcn/moraine"
Repository = "https://github.com/kanglcn/moraine"

[tool.setuptools.dynamic]
version = { attr = "moraine.__version__" }

[tool.setuptools.packages.find]
include = ["moraine*"]

[tool.setuptools.package-data]
"moraine.cli" = ["*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU with cupy (skipped otherwise)",
    "data: needs the local test data set (skipped otherwise)",
    "slow: slow tests",
]

[tool.ruff]
extend-exclude = ["nbs", ".ipynb_checkpoints"]

[tool.ruff.lint]
# only errors that break at run time: syntax errors, undefined names, invalid comparisons / statements
select = ["E9", "F63", "F7", "F82"]
